services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,0.0.0.0"
      SQLITE_PATH: "/app/data/db.sqlite3"
      MEDIA_ROOT: "/app/media"
      GALLERY_HOME_IMAGE_LIMIT: "100"
    volumes:
      - sqlite_data:/app/data
      - media_data:/app/media

volumes:
  sqlite_data:
  media_data:
